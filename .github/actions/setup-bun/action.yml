name: Setup Bun
description: Setup Bun environment

inputs:
    bun-version:
        description: Bun version
        required: false
        default: latest

runs:
    using: composite
    steps:
        - name: Setup Bun ${{ inputs.bun-version }}
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: ${{ inputs.bun-version }}

        - name: Install dependencies
          shell: bash
          # NOTE: --frozen-lockfile disabled due to Bun bug oven-sh/bun#19088
          # (workspace + file:.. dep triggers false-positive drift). Re-enable
          # once oven-sh/bun#29052 lands.
          run: bun install
