name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-bun

            - name: Build
              run: bun run build

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-bun

            - name: Build
              run: bun run build

            - name: Typecheck
              run: bun run check-types

    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-bun

            - name: Run Ultracite
              run: bunx ultracite check
